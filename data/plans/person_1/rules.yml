rules:
  - { icon: "🍽️", title: "Cadência: 4 refeições/dia", description: "Gerar café da manhã, almoço, lanche da tarde e jantar para a Pessoa 1 (Ele)." }
  - { icon: "💧",  title: "Hidratação: 3L+/dia",  description: "Mounjaro pode causar desidratação." }
  - { icon: "☕",  title: "Café preto é livre",   description: "0 kcal, termogênico. Sem açúcar nem cremes." }
  - { icon: "🚫",  title: "Zero açúcar refinado", description: "Impacto direto na TGP e esteatose." }
  - { icon: "🍺",  title: "Álcool: limitar",       description: "Máx. 1-2 doses no fim de semana." }
  - { icon: "🏋️",  title: "Musculação 3-4×/sem", description: "Inegociável em deficit." }
  - { icon: "📏",  title: "Pesagem semanal",       description: "Jejum, manhã. Tendência de 4 semanas." }
  - { icon: "🍽️", title: "Mounjaro cortou a fome?", description: "Nunca pule proteína. Mín. 140g P/dia." }
  - { icon: "🔁",  title: "Use a calculadora",    description: "Troque refeições mantendo macros." }

disclaimer: >-
  Este plano não substitui nutricionista/endocrinologista. Mounjaro requer
  prescrição médica. Macros são estimativas. Reavaliar a cada 4 semanas:
  >1 kg/sem → +100 kcal; estagnado 2+ sem → -100 kcal ou +atividade.
