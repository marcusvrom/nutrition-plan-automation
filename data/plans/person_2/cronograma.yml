intro: >-
  Pesar 1×/sem, sempre na mesma manhã, em jejum, após urinar. Foto frontal/
  lateral mensal — espelho mente, foto não.

items:
  - date: "Semana 0 — Setup"
    title: "Preparação e consultas iniciais"
    body: >-
      Marcar consulta com endócrino (prioritário). Tratar ITU com ginecologista
      / clínico. Repetir urina + urocultura. Medições basais: peso,
      circunferência abdominal, circunferência de quadril. Foto frontal e
      lateral. Compras semanais e primeiro meal prep no domingo.

  - date: "Semanas 1-2 — Adaptação"
    title: "Curva de aprendizado e perda inicial rápida"
    body: >-
      Foco em criar rotina, não em perfeição. Perda esperada de 2-4 kg
      (água + glicogênio + alguma gordura). Possível fome ou irritabilidade
      — manter hidratação, whey extra se necessário. Caminhadas 20-30 min
      em ritmo moderado, 4×/sem.

  - date: "Semana 4 — Primeira reavaliação"
    title: "Consulta com endócrino + medidas"
    body: >-
      Meta: -3,5 a -4,5 kg. Endócrino pode iniciar metformina 500 mg 1×/dia
      (escalando até 1.500-2.000 mg) ou GLP-1 (Mounjaro/Ozempic). Iniciar
      treino de força 2×/sem se autorizado.

  - date: "Semana 6 — Refeed estratégico"
    title: "Quebra de platô preventiva"
    body: >-
      Adicionar 1 dia/sem com manutenção calórica (~2.300 kcal, foco em carbo)
      para recalibrar leptina. Continua o restante da semana em deficit.
      Pode evitar platô clássico de semana 6-8.

  - date: "Semana 8 — Segunda reavaliação"
    title: "Repetir exames-chave"
    body: >-
      Meta: -7 a -9 kg. Repetir: Vit D, perfil lipídico, glicemia jejum,
      insulina (HOMA-IR), TGP/TGO, hemograma, urina. Esperado: melhora de
      LDL, Vit D em ascensão, possível redução de testosterona.

  - date: "Semana 12 — Marco principal"
    title: "Reavaliação completa"
    body: >-
      Meta: -10 a -13 kg → peso ~120-123 kg, IMC ~39 (sai do grau 3!).
      Painel completo + dosagens hormonais (testosterona, S-DHEA, SHBG,
      LH/FSH em fase folicular).

  - date: "Mês 6 — Reavaliação ampla"
    title: "Marco de meio caminho"
    body: >-
      Meta: -18 a -24 kg → peso ~109-115 kg, IMC ~36. Possível normalização
      do ciclo menstrual (sinal mais robusto de melhora da SOP).

  - date: "Mês 12 — Consolidação"
    title: "Saída do grau 3 → grau 1 e estratégia de manutenção"
    body: >-
      Meta: -28 a -33 kg → peso ~100-105 kg, IMC ~33. Painel completo +
      ultrassom pélvico. Iniciar fase de manutenção: deficit menor (~300 kcal),
      mais flexibilidade.
