intro: >-
  Painel clínico anonimizado. Dados laboratoriais específicos foram removidos
  do repositório público; manter apenas alertas gerais e orientações de
  acompanhamento profissional.

alerts:
  - level: warn
    title: "⚠ Acompanhamento profissional recomendado"
    body: >-
      Plano alimentar com déficit calórico, histórico clínico ou uso de
      medicamentos deve ser acompanhado por médico e/ou nutricionista.
  - level: info
    title: "ℹ Dados sensíveis anonimizados"
    body: >-
      Exames, condições clínicas e interpretações específicas não devem ser
      mantidos em repositório público. Guarde detalhes em local privado.

exams: []

follow_up: >-
  Registrar apenas pendências genéricas no repositório público. Detalhes de
  exames, diagnósticos, medicamentos e condutas devem ficar em arquivo privado
  ou em acompanhamento profissional.
