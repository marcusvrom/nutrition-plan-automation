intro: >-
  Por que esse plano é diferente de uma dieta genérica? SOP exige abordagem
  específica que ataca a raiz metabólica. E porque vocês moram juntos, foi
  desenhado para aproveitar o meal prep dele.

pillars:
  - icon: "📉"
    pillar: "Pilar 01 · Glicêmico"
    title: "Carboidrato controlado e timing"
    description: >-
      Carbo só com fibra + proteína + gordura, nunca isolado. Reduzir porção
      vs. plano dele, priorizar integral. Frutas sempre com proteína. Sem
      suco, sem refrigerante diet.
  - icon: "🥩"
    pillar: "Pilar 02 · Proteína"
    title: "130 g/dia · preservação de massa magra"
    description: >-
      1,9 g/kg de peso ideal (~68 kg → 130 g). Distribuída em 4 refeições
      + 1 lanche, ≥25 g cada. Receitas do meal prep dele já são proteína-pesadas.
  - icon: "🐟"
    pillar: "Pilar 03 · Anti-inflamatório"
    title: "Ômega-3 + crucíferas + cúrcuma"
    description: >-
      Peixe gordo 1-2×/sem (sardinha, salmão), ômega-3 EPA+DHA ≥2g/dia,
      brócolis e couve-flor diários (DIM regula estrogênio), azeite EV
      como gordura principal, frutas vermelhas.
  - icon: "💊"
    pillar: "Pilar 04 · Inositol"
    title: "Mio + D-chiro inositol 40:1"
    description: >-
      Maior corpo de evidência clínica em SOP depois da metformina. 4 g
      mio + 100 mg D-chiro/dia, 2 tomadas. Custo baixo, sem efeitos colaterais
      relevantes.
  - icon: "🩸"
    pillar: "Pilar 05 · Lipídico"
    title: "Reduzir LDL via padrão alimentar"
    description: >-
      LDL 152 + Não-HDL 172 aos 21 anos é prioridade. Reduzir saturada
      <7% kcal, zerar ultraprocessados, fibra solúvel ≥10 g/dia,
      gordura mono/poli-insaturada substituindo saturada.
  - icon: "🤝"
    pillar: "Pilar 06 · Sustentabilidade"
    title: "Mesmo prato, porção dela"
    description: >-
      Compra única, prep único, mesma comida. Diferença só nas porções:
      ela come ~70-85% do que ele come. Resolve economia, praticidade
      e prazer de comer junto.
