# Categorização da lista de compras + tags + notas de uso + tabela de
# substituições econômicas. As quantidades ficam fora daqui (são calculadas
# pelo `shopping-list.ts`); use `override_quantity` apenas quando o item
# não tiver consumo computado (despensa pura).

intro: >-
  Lista para os dois (Pessoa 1 (Ele) + Pessoa 2 (Ela)) — versão econômica (só opções otimizadas).
  Itens com 📦 são de estoque (duram semanas/meses) — só repor quando acabar.
  Itens com 🌿 são frescos. Itens com 🌸 são exclusivos/aumentados para a Pessoa 2 (Ela).

categories:
  - id: proteinas
    name: Proteínas
    icon: "🥩"
    cost_estimate_brl: { min: 105, max: 130 }
    items:
      - { ingredient: "peito de frango em cubos", tags: [shared],
          usage_note: "Comprar peça inteira é ~25% mais barato; pedir ao açougueiro para limpar e cortar" }
      - { ingredient: "frango desfiado", tags: [shared],
          usage_note: "Vem da mesma peça inteira — desfiar no prep" }
      - { ingredient: "carne moída magra", tags: [shared],
          usage_note: "Blend acém + músculo 50/50: sabor + magreza, ~R$ 18-25/sem mais barato que patinho" }
      - { ingredient: "acém em peça (em tiras)", tags: [shared],
          usage_note: "Coxão duro em tiras finas + marinada com gengibre = igualmente macio (~R$ 8-10/sem)" }
      - { ingredient: "fraldinha", tags: [shared],
          usage_note: "Pressão 40 min → 4 porções de fraldinha com purê" }
      - { ingredient: "ovo inteiro", tags: [shared],
          usage_note: "Comum em vez de caipira — 18-24 unidades/sem" }
      - { ingredient: "clara de ovo", tags: [shared],
          usage_note: "Para omeletes proteicos — usar mesmo lote dos ovos" }
