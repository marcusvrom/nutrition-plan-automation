# Perfis das duas pessoas. Cada uma tem seu plano em data/plans/<id>/.
# Receitas são compartilhadas; porções são por pessoa via `portions:` na receita
# ou via `servings:` no slot do plano.

people:
  - id: marcus
    name: Marcus
    sex: male
    age: 30
    height_cm: 178
    weight_kg: 110
    activity_level: moderate
    medications: ["Mounjaro 2.5 mg"]
    daily_targets:
      kcal: 1850
      protein_g: 160
      carbs_g: 170
      fat_g: 55
    metadata:
      eyebrow: "Plano Alimentar Personalizado · v3"
      title: "Deficit Inteligente"
      subtitle: "3 refeições, meal prep dominical, 13 receitas integradas. ~110 kg + Mounjaro 2.5 mg."
      version: "v3"
      goal: "deficit ~500 kcal sobre TDEE de ~2.350; perda ~0,5 kg/sem"
      meals_per_day: 3
      deficit_kcal: 500
      projection: "Perda alvo ~0,5 kg/semana"

  - id: rafaella
    name: Rafaella
    sex: female
    age: 21
    height_cm: 175
    weight_kg: 133
    imc: 43.4
    activity_level: light
    conditions: ["SOP", "dislipidemia", "ITU em investigação"]
    daily_targets:
      kcal: 1750
      protein_g: 130
      carbs_g: 170
      fat_g: 60
      fiber_g: 30
      water_l: 3.0
      sodium_mg_max: 2300
