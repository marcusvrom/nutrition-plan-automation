# Planos alimentares por pessoa.
# - Marcus: 3 refeições/dia, semanas A e B (rotação).
# - Rafaella: 5 refeições/dia, 1 semana padrão (dieta SOP).
#
# Cada slot referencia uma receita; `servings` é o multiplicador para o
# cálculo de macros. Quando a receita já tem `portions:` por pessoa,
# o cálculo usa as macros customizadas dessa variant × servings.

