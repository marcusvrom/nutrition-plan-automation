# Plano alimentar semanal.
#
# Cada slot referencia uma receita por `recipe_id` (slug do arquivo em data/recipes/)
# e quantas porções (servings) cada pessoa consome.
#
# Um servings == uma porção tal como definida no front-matter da receita.
# Para refeições muito simples (ex: 2 ovos mexidos), use receitas próprias
# em vez de inventar quantidades aqui.

week_starts_on: monday
days:
  monday:
    breakfast:
      recipe_id: omelete-proteico
      servings: { marcus: 1.0, namorada: 0.7 }
    lunch:
      recipe_id: frango-curry
      servings: { marcus: 1.0, namorada: 0.7 }
    dinner:
